# 第2セットの正解と解説（自己採点用）

s01:
  answer: b
  explanation: 今の位置でブランチを作ればコミットは残る。そのあと main を元の位置に戻せばよい。force push は他人の作業を消す危険がある。
s02:
  answer: a
  explanation: 変更はあるが、まだステージ（git add）されていない状態。コミットに含めるには git add が必要。
s03:
  answer: c
  explanation: git pull はリモートの変更を取得して、今のブランチに取り込む。push は送る方向。
s04:
