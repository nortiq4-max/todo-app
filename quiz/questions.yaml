# 理解度チェック（30問）
# GH-900 の公式の出題範囲（7分野）に沿って作ったオリジナル問題です。
# 実際の試験問題ではありません。答えは quiz/answers.yaml に a〜d で書き、
# python grader/quiz.py で自己採点します（応募の点数には入りません）。

- id: q01
  domain: GitとGitHubの基本
  question: Gitの説明として正しいものはどれ？
  choices:
    a: GitHubが提供するクラウドストレージの名前
    b: 各自のPCに履歴の全体を持てる、分散型のバージョン管理システム
    c: サーバーにつながっていないと履歴を見られない仕組み
    d: 文書を自動で翻訳するツール

- id: q02
  domain: GitとGitHubの基本
  question: git clone を実行すると何が起きる？
  choices:
    a: リモートのリポジトリを、履歴ごと手元に複製する
    b: 手元の変更をリモートに送る
    c: 新しいブランチを作る
    d: 直前のコミットを取り消す

- id: q03
  domain: GitとGitHubの基本
  question: コミットの説明として正しいものはどれ？
  choices:
    a: リモートのリポジトリを削除する操作
    b: ほかの人にレビューを頼む操作
    c: ファイルの変更を、メッセージつきで履歴に記録する操作
    d: 2つのブランチを統合する操作

- id: q04
  domain: GitとGitHubの基本
  question: ブランチを使う主な理由はどれ？
  choices:
    a: リポジトリの容量を減らすため
    b: パスワードを安全に保存するため
    c: 公開範囲を変更するため
    d: mainブランチに影響を与えずに、機能追加や修正を別に進めるため

- id: q05
  domain: GitとGitHubの基本
  question: git fetch と git pull の違いとして正しいものはどれ？
  choices:
    a: fetchはリモートの変更を取得するだけ。pullは取得したうえで今のブランチに統合する
    b: fetchは手元の変更を送る。pullは受け取る
    c: どちらもまったく同じ動きをする
    d: pullは取得するだけ。fetchは取得して統合する

- id: q06
  domain: GitとGitHubの基本
  question: GitとGitHubの関係として正しいものはどれ？
  choices:
    a: GitHubはGitの古い名前である
    b: GitはGitHubの上でしか使えない
    c: GitはGitHubの有料プランの名前である
    d: Gitはバージョン管理のツールで、GitHubはGitのリポジトリを置いて共同作業できるサービスである

- id: q07
  domain: GitとGitHubの基本
  question: まだ追跡していないファイルを .gitignore に書くと、どうなる？
  choices:
    a: GitHub上で非公開になる
    b: 自動で暗号化される
    c: Gitの追跡対象から外れ、コミットに含まれなくなる
    d: そのファイルが削除される

- id: q08
  domain: リポジトリの扱い
  question: 「招待された人だけが見られる」リポジトリの公開範囲はどれ？
  choices:
    a: パブリック
    b: アーカイブ
    c: プライベート
    d: フォーク

- id: q09
  domain: リポジトリの扱い
  question: テンプレートリポジトリから新しいリポジトリを作ったときの説明として正しいものはどれ？
  choices:
    a: 元のリポジトリのコミット履歴がすべて引き継がれる
    b: 元のリポジトリと自動で同期され続ける
    c: 元のリポジトリの所有者だけが編集できる
    d: ファイルとフォルダの構成は同じで、履歴は1つのコミットから始まる

- id: q10
  domain: 共同作業の機能
  question: フォークの説明として正しいものはどれ？
  choices:
    a: 他人のリポジトリを自分のアカウントにコピーし、変更をプルリクエストで提案できるようにする
    b: リポジトリを削除する
    c: リポジトリを2つに分割する
    d: 他人のリポジトリに直接プッシュする権限をもらう

- id: q11
  domain: 共同作業の機能
  question: プルリクエストの目的として最も適切なものはどれ？
  choices:
    a: リポジトリの公開範囲を変える
    b: Issueを削除する
    c: サーバーにアプリを公開する
    d: 変更内容をレビューしてもらい、ブランチを統合する提案をする

- id: q12
  domain: 共同作業の機能
  question: ドラフトのプルリクエストについて正しいものはどれ？
  choices:
    a: 作成者以外は閲覧できない
    b: 作成すると自動でマージされる
    c: 作業中であることを示し、「レビューの準備ができた」に切り替えるまでマージできない
    d: Issueにしか使えない

- id: q13
  domain: 共同作業の機能
  question: レビューで「Request changes（変更を依頼）」を選ぶと、どういう意味になる？
  choices:
    a: そのプルリクエストを承認した
    b: マージの前に修正が必要だと伝えた
    c: コメントしただけで、判断はしていない
    d: プルリクエストを閉じた

- id: q14
  domain: 共同作業の機能
  question: プルリクエストの説明欄に「Closes #12」と書き、デフォルトブランチにマージした。何が起きる？
  choices:
    a: Issue #12 が自動でクローズされる
    b: プルリクエスト #12 が削除される
    c: 12個目のコミットが取り消される
    d: 何も起きない

- id: q15
  domain: 共同作業の機能
  question: マイルストーンの使い方として正しいものはどれ？
  choices:
    a: リポジトリのファイルを圧縮する
    b: コードの脆弱性を見つける
    c: ブランチを保護する
    d: リリースや期限ごとにIssueやプルリクエストをまとめ、進み具合を追う

- id: q16
  domain: 共同作業の機能
  question: コメントで「@ユーザー名」と書くと何が起きる？
  choices:
    a: そのユーザーがリポジトリから外される
    b: そのユーザーに通知が届く
    c: そのユーザーが管理者になる
    d: そのユーザーのコミットが取り消される

- id: q17
  domain: 共同作業の機能
  question: GitHub Discussions の使い方として最も合っているものはどれ？
  choices:
    a: 秘密情報を共有する
    b: CIの設定を書く
    c: 質問やアイデアなど、Issueにする前の会話をする
    d: コードを自動で修正する

- id: q18
  domain: 共同作業の機能
  question: CODEOWNERS ファイルを置くと何が起きる？
  choices:
    a: 指定したファイルを変更するプルリクエストで、担当者に自動でレビューが依頼される
    b: 指定したファイルが暗号化される
    c: 指定したファイルを誰も変更できなくなる
    d: 指定したユーザーがリポジトリの所有者になる

- id: q19
  domain: モダンな開発
  question: GitHub Actions のワークフローの説明として正しいものはどれ？
  choices:
    a: Wordファイルで書いて、メールで送る
    b: YAMLで書いて .github/workflows/ に置き、pushなどのイベントで自動で実行される
    c: GitHubの社員しか作れない
    d: 自分のPCの上でしか動かない

- id: q20
  domain: モダンな開発
  question: CI（継続的インテグレーション）の説明として正しいものはどれ？
  choices:
    a: 本番サーバーを手作業で更新すること
    b: 年に1回まとめてテストすること
    c: ドキュメントを翻訳すること
    d: 変更のたびに自動でビルドやテストを行い、問題を早く見つけること

- id: q21
  domain: モダンな開発
  question: GitHub Codespaces の説明として正しいものはどれ？
  choices:
    a: GitHubのオフィスの名前
    b: クラウド上の開発環境を、ブラウザやエディタから使えるサービス
    c: リポジトリのバックアップ専用の機能
    d: プルリクエストの別名

- id: q22
  domain: モダンな開発
  question: GitHub Copilot などのAIによるコード提案の使い方として、適切なものはどれ？
  choices:
    a: 提案されたコードは確認せず、そのまま本番に入れる
    b: パスワードやAPIキーを貼り付けて、使い方を聞く
    c: 提案されたコードを読んで理解し、テストで確かめてから使う
    d: どのコードもライセンスを気にせず、自分の作品として公開する

- id: q23
  domain: プロジェクト管理
  question: GitHub Projects でできることとして正しいものはどれ？
  choices:
    a: IssueやプルリクエストをテーブルやボードやロードマップのViewで管理する
    b: 他人のリポジトリを削除する
    c: Gitの履歴を書き換える
    d: 支払い方法を登録する

- id: q24
  domain: プロジェクト管理
  question: Issueのテンプレートを使えるようにするには、ファイルをどこに置く？
  choices:
    a: リポジトリのどこでもよい
    b: src/ フォルダ
    c: .gitignore の中
    d: .github/ISSUE_TEMPLATE/ フォルダ

- id: q25
  domain: プライバシー・セキュリティ・管理
  question: 二要素認証（2FA）を有効にする目的として正しいものはどれ？
  choices:
    a: リポジトリの容量を増やすため
    b: パスワードに加えて別の確認を求め、アカウントの乗っ取りを防ぐため
    c: プルリクエストを自動でマージするため
    d: 公開範囲を変えるため

- id: q26
  domain: プライバシー・セキュリティ・管理
  question: Dependabot の説明として正しいものはどれ？
  choices:
    a: 依存しているパッケージの脆弱性を知らせ、更新のプルリクエストを自動で作れる
    b: コードの書き方を自動で採点する
    c: ブランチを自動で削除する
    d: Issueに自動で返信する

- id: q27
  domain: プライバシー・セキュリティ・管理
  question: ブランチ保護ルールでできることとして正しいものはどれ？
  choices:
    a: リポジトリを非公開にする
    b: コミットメッセージを自動で翻訳する
    c: マージの前に、レビューの承認やステータスチェックの合格を必須にする
    d: Issueを自動で作る

- id: q28
  domain: GitHubコミュニティ
  question: LICENSE ファイルがない公開リポジトリのコードについて、正しいものはどれ？
  choices:
    a: 公開されているので、誰でも自由に再利用してよい
    b: 原則として著作権の保護を受け、作者の許可なく複製・配布・改変はできない
    c: 自動でMITライセンスになる
    d: 著作権がGitHubに移る

- id: q29
  domain: GitHubコミュニティ
  question: CONTRIBUTING.md を置く主な目的はどれ？
  choices:
    a: 依存関係を自動で更新する
    b: アプリのパスワードを保存する
    c: リポジトリの動作を速くする
    d: 貢献の手順やルールを示す。Issueやプルリクエストを作る画面にもリンクが表示される

- id: q30
  domain: GitHubコミュニティ
  question: GitHub Sponsors の説明として正しいものはどれ？
  choices:
    a: 企業がGitHubの広告枠を買う仕組み
    b: オープンソースの開発者やプロジェクトを、お金で継続的に支援できる仕組み
    c: 有料のコードレビューサービス
    d: リポジトリを売買する仕組み
